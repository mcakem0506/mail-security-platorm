# Стенд проверки транспорта шлюза (ТЗ 1.1 §67). Профиль: gateway-test.
#
# Стенд изолирован: своя сеть, свои тома, ничего не публикуется наружу кроме loopback-портов
# для проверок с хоста. Он не подключается к почте организации и не меняет DNS (§60).
#
# Адреса статические намеренно. Доверие шлюза определяется подсетью источника, поэтому
# «доверенный Exchange» и «недоверенный клиент» в проверках обязаны различаться адресом:
#   10.77.0.64/26  — доверенные источники (internal.trusted_networks)
#   прочие адреса  — недоверенные
name: ${COMPOSE_PROJECT_NAME:-msp-gwtest}

x-tools: &tools
  build:
    context: ../..
    dockerfile: deployment/gateway/test/Dockerfile.tools
  image: msp-gateway-tools:test
  profiles: [gateway-test]
  restart: "no"

services:
  gateway-postfix:
    build:
      context: ../..
      dockerfile: deployment/gateway/Dockerfile
    image: msp-gateway:test
    profiles: [gateway-test]
    hostname: gw.lab.example
    restart: "no"
    # Минимальные возможности (§8): ничего сверх нужного Postfix. Привилегированный режим и
    # доступ к сокету Docker не используются.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, KILL, NET_BIND_SERVICE]
    environment:
      # Пробы агента (ТЗ 1.1 §47, §48): уровни Exchange, самопроверка открытого релея, сертификаты.
      MSP_PROBE_EXCHANGE: fake-exchange:2526:fake-exchange,fake-exchange-2:2526:fake-exchange-2
      MSP_PROBE_CA: /run/secrets/gateway/ca.crt
      MSP_PROBE_RECIPIENT: ivan@corp.example
      MSP_PROBE_SELFTEST: "1"
      MSP_PROBE_RELAY_PORT: "25"
      MSP_PROBE_INTERVAL: "15"
      MSP_CERT_FILES: smtp-public=/run/secrets/gateway/tls.crt
      MSP_COLLECTOR_STATUS: /var/lib/msp/status/collector.json
      # Связь с панелью (ТЗ 1.1 §37): по умолчанию выключена, узел работает автономно.
      MSP_PANEL_URL: ${GW_PANEL_URL:-}
      MSP_PANEL_TOKEN_FILE: ${GW_PANEL_TOKEN_FILE:-}
      MSP_SYNC_INTERVAL: "${GW_SYNC_INTERVAL:-30}"
    # Адрес хоста внутри контейнера: панель в проверках запускается на стороне разработчика.
    extra_hosts: ["host.docker.internal:host-gateway"]
    security_opt: ["no-new-privileges:true"]
    networks:
      gwnet:
        ipv4_address: 10.77.0.10
    ports:
      - "127.0.0.1:${GW_PORT_IN:-12525}:25"
      - "127.0.0.1:${GW_PORT_INTERNAL:-12526}:2525"
      - "127.0.0.1:${GW_PORT_METRICS:-19100}:9100"
    volumes:
      - gw-queue:/var/spool/postfix
      - gw-var:/var/lib/msp
      - ${GW_TEST_DIR:?укажите каталог стенда}/bootstrap:/bootstrap:ro
      - ${GW_TEST_DIR}/bundles:/bundles:ro
      - ${GW_TEST_DIR}/secrets/gateway:/run/secrets/gateway:ro

  # Сборщик теневых копий (ТЗ 1.1 §34, §67): отдельный контейнер, отдельный процесс, права
  # владельца журнала и больше ничего. Его остановка или сбой не касаются доставки. Включается
  # профилем gateway-panel вместе с панелью: без адреса приёмника ему нечего делать.
  gateway-shadow-collector:
    image: msp-gateway:test
    profiles: [gateway-panel]
    restart: "no"
    depends_on:
      gateway-postfix: {condition: service_healthy}
    user: "10002:10002"
    entrypoint:
      - python3
      - -m
      - msp_gateway.node
      - collector
      - --interval
      - "2"
    environment:
      MSP_INGEST_URL: ${GW_INGEST_URL:-}
      MSP_INGEST_TOKEN_FILE: ${GW_PANEL_TOKEN_FILE:-}
      MSP_COLLECTOR_STATUS: /var/lib/msp/status/collector.json
      MSP_JOURNAL_DIR: /var/lib/msp/journal
      MSP_IDENTITY_DIR: /var/lib/msp
    extra_hosts: ["host.docker.internal:host-gateway"]
    # Проверка здоровья образа относится к Postfix; у сборщика своя: свежий отчёт о проходе.
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import os,sys,time; sys.exit(0 if time.time()-os.stat('/var/lib/msp/status/collector.json').st_mtime < 60 else 1)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      gwnet:
        ipv4_address: 10.77.0.40
    volumes:
      - gw-var:/var/lib/msp
      - ${GW_TEST_DIR:?укажите каталог стенда}/secrets/gateway:/run/secrets/gateway:ro

  fake-exchange:
    <<: *tools
    networks:
      gwnet:
        ipv4_address: 10.77.0.20
    environment:
      SMTP_PORT: "2526"
      CONTROL_PORT: "8025"
      TLS_CERT: /run/secrets/exchange/exchange.crt
      TLS_KEY: /run/secrets/exchange/exchange.key
      REQUIRE_STARTTLS: "1"
    ports:
      - "127.0.0.1:${EX1_CONTROL:-18025}:8025"
    volumes:
      - ${GW_TEST_DIR}/secrets/exchange:/run/secrets/exchange:ro

  fake-exchange-2:
    <<: *tools
    networks:
      gwnet:
        ipv4_address: 10.77.0.21
    environment:
      SMTP_PORT: "2526"
      CONTROL_PORT: "8025"
      TLS_CERT: /run/secrets/exchange/exchange.crt
      TLS_KEY: /run/secrets/exchange/exchange.key
      REQUIRE_STARTTLS: "1"
    ports:
      - "127.0.0.1:${EX2_CONTROL:-18026}:8025"
    volumes:
      - ${GW_TEST_DIR}/secrets/exchange:/run/secrets/exchange:ro

  outbound-sink:
    <<: *tools
    networks:
      gwnet:
        ipv4_address: 10.77.0.30
    environment:
      SMTP_PORT: "2527"
      CONTROL_PORT: "8025"
    ports:
      - "127.0.0.1:${SINK_CONTROL:-18027}:8025"

networks:
  gwnet:
    driver: bridge
    ipam:
      config:
        - subnet: 10.77.0.0/24
          gateway: 10.77.0.1

volumes:
  gw-queue:
  gw-var:
