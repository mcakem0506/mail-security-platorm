# Сгенерировано MSP. Наружу не публикуются ни оценка, ни топология, ни секреты (§31).
use = ["authentication-results", "x-rspamd-queue-id", "remove-headers"];
extended_spam_headers = false;
skip_local = false;
skip_authenticated = false;
routines {
    authentication-results {
        header = "Authentication-Results";
        remove = false;
        add_smtp_user = false;
    }
    x-rspamd-queue-id {
        header = "X-MSP-Scan-ID";
        remove = 0;
    }
    remove-headers {
        headers {
            "X-Spamd-Result" = 0;
            "X-Spamd-Bar" = 0;
            "X-Spam-Status" = 0;
            "X-Spam" = 0;
            "X-Spam-Flag" = 0;
            "X-Spam-Level" = 0;
            "X-Rspamd-Score" = 0;
            "X-Rspamd-Action" = 0;
            "X-Rspamd-Server" = 0;
            "X-Rspamd-Queue-Id" = 0;
        }
    }
}
authenticated_headers = ["authentication-results"];
