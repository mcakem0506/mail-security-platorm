# Reverse proxy for the Mail Security Platform (ТЗ 29, 30).
#
# Everything the user reaches goes through here: the console, the add-in static files and the
# API. The database, Redis and object storage are on internal networks and are not proxied.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # The request id is generated here when the client does not supply one, so a request can be
    # traced through nginx, the API and the worker logs (ТЗ 31).
    map $http_x_request_id $request_id_final {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"request_id":"$request_id_final",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration":$request_time,'
        '"upstream_time":"$upstream_response_time"'
    '}';
    # The query string is deliberately excluded: it may carry indicator values (ТЗ 31).
    access_log /var/log/nginx/access.log json;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 30m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;
    large_client_header_buffers 4 16k;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml;
    gzip_min_length 1024;

    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    upstream msp_api {
        server api:8000 max_fails=3 fail_timeout=15s;
        keepalive 16;
    }

    # Plain HTTP exists only to redirect; the pilot may disable this block when TLS terminates
    # on an upstream load balancer.
    server {
        listen 80;
        server_name _;

        location /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1h;
        ssl_session_tickets off;

        # nginx add_header is not additive: a location that defines any add_header discards
        # the ones inherited from here. Every location below therefore includes the shared set
        # explicitly via security_headers.conf.
        include /etc/nginx/conf.d/security_headers.conf;

        limit_conn conn 32;

        location /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # Login is rate limited separately: credential stuffing must not consume the API budget.
        location = /api/v1/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://msp_api;
            include /etc/nginx/conf.d/proxy_common.conf;
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://msp_api;
            include /etc/nginx/conf.d/proxy_common.conf;
        }

        location /health/ {
            proxy_pass http://msp_api;
            include /etc/nginx/conf.d/proxy_common.conf;
        }

        # Metrics are for the monitoring network only, never the user network (ТЗ 31).
        # Narrow these ranges to the actual monitoring host before the production pilot.
        location /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://msp_api;
            include /etc/nginx/conf.d/proxy_common.conf;
        }

        # The add-in is framed by Outlook, so it needs its own frame-ancestors policy.
        location /addin/ {
            alias /usr/share/nginx/html/addin/;
            # The add-in is framed by Outlook, so X-Frame-Options is deliberately omitted here
            # and framing is constrained by frame-ancestors in the CSP below instead.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://appsforoffice.microsoft.com; style-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors https://outlook.office.com https://outlook.office365.com https://*.outlook.com https://*.office.com" always;
            expires 5m;
        }

        location /addin/manifest.xml {
            alias /usr/share/nginx/html/addin/manifest.xml;
            default_type application/xml;
            expires -1;
        }

        location /assets/ {
            root /usr/share/nginx/html/console;
            expires 1y;
            include /etc/nginx/conf.d/security_headers.conf;
            add_header Cache-Control "public, immutable" always;
        }

        location / {
            root /usr/share/nginx/html/console;
            try_files $uri $uri/ /index.html;
            include /etc/nginx/conf.d/security_headers.conf;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; form-action 'self'; base-uri 'none'; object-src 'none'" always;
            expires -1;
        }
    }
}
