# Реестр известных пробелов детектирования (ТЗ 1.0.3 §27).
#
# Пробел здесь — это осознанно принятое ограничение: у него есть владелец, оценка серьёзности и
# целевой релиз. Пропуск, попадающий в зарегистрированный пробел, гейт пропускает как известный;
# пропуск без записи — регрессия и блокер (ТЗ 1.0.3 §60).
#
# Реестр существует, чтобы «мы про это знаем» нельзя было сказать задним числом.
gaps:
  - id: GAP-001
    category: impersonation
    description: >-
      Вставка или удвоение символа в короткой метке домена (coorp.example, corpp.example для
      corp.example) не распознаётся как опечаточный домен.
    root_cause: >-
      Проверка опечаточных доменов не применяется к меткам короче шести символов. Для
      четырёхбуквенной метки расстояние в один символ даёт десятки обычных слов (card, core,
      cork, corn), и снижение порога дало бы поток ложных срабатываний на легитимной почте.
      Ограничение осознанное: цена ложного срабатывания здесь выше цены пропуска.
    severity: low
    status: VALIDATION
    owner: detection-sender@corp.example
    target_release: MSP 1.0.4
    examples:
      - IMP-017
      - IMP-018
    mitigation: >-
      Организациям с короткими корпоративными доменами рекомендуется регистрировать очевидные
      варианты написания. Дополнительно такие письма ловятся остальными признаками: отсутствие
      истории отправителя, провал DMARC, платёжная тематика.
    planned_fix: >-
      Закрыто в MSP 1.0.4 §3 условным детектором коротких меток: четыре преобразования
      (вставка, удаление, замена, перестановка соседних) на метках не длиннее пяти символов,
      SND-024 при наличии второго независимого признака и SND-025 с нулевым весом без него.
      Оба кейса IMP-017 и IMP-018 детектируются, корпус вырос до 552 кейсов, из них 241
      доброкачественный; precision 1.000, recall 1.000, ложных срабатываний ноль.

      Статус VALIDATION, а не RESOLVED: закрытие подтверждено на синтетическом корпусе, но не
      на реальном потоке. Теневой прогон трижды показывал, что правило нельзя включать в
      исходном виде — вторичными признаками были выбраны сигналы, верные для всей почты
      сразу (новизна отправителя при пустой истории; отсутствие подписи DKIM), и один
      недостижимый (его выдаёт только выключенный семантический провайдер). Именно поэтому
      подтверждение на потоке требуется: на корпусе такие ошибки видны, а на реальной почте
      их цена выше.

  - id: GAP-002
    category: qr_phishing
    description: >-
      Содержимое QR-кода читается, если установлен необязательный компонент «qr». Без него
      определяется только наличие кода.
    root_cause: >-
      Декодер разбирает пиксели изображений из недоверенных писем, поэтому он вынесен в
      необязательный компонент и запускается в отдельном процессе с ограничениями по размеру,
      числу пикселей и времени. Это сознательный выбор: держать такую зависимость внутри
      рабочего процесса означало бы отдавать ей байты злоумышленника без изоляции.
    severity: low
    status: VALIDATION
    owner: detection-core@corp.example
    target_release: MSP 1.0.3B
    examples:
      - QRD-001
      - QRD-002
    mitigation: >-
      При установленном декодере ссылка из кода проходит обычный конвейер URL, и правило
      URL-032 работает в активном режиме. Без декодера остаются URL-030 и URL-031 по форме
      изображения и формулировкам, а проверка помечается неполной (QR_NOT_DECODED), поэтому
      письмо не может получить чистый вердикт за счёт непрочитанного.
    planned_fix: >-
      Закрыт в MSP 1.0.3B. Остаётся в реестре со статусом VALIDATION до подтверждения на
      реальном потоке: пробел закрывается не изменением кода, а кейсом, который раньше падал,
      а теперь проходит.

  - id: GAP-004
    category: qr_phishing
    description: QR-коды внутри PDF-вложений не извлекаются.
    root_cause: >-
      Извлечение изображений из PDF требует разбора самого PDF — формата с собственной
      историей уязвимостей разбора. Безопасный конвейер для него в 1.0.3B не строился: это
      отдельная работа, а не побочный результат добавления декодера QR.
    severity: medium
    status: VALIDATION
    owner: detection-attachment@corp.example
    target_release: MSP 1.1
    examples:
      - SBX-007
      - SBX-008
      - SBX-009
      - SBX-010
      - SBX-011
    mitigation: >-
      Страницы PDF рисуются в изолированном процессе (msp_attachment_sandbox.pdf_worker) и в виде
      изображений передаются второму изолированному процессу — декодеру QR. Код, встроенный
      растровой картинкой, и код, нарисованный векторно, находятся одинаково (SBX-007, SBX-008);
      обычный PDF без кода проходит без ложных срабатываний (SBX-009). Зашифрованный, повреждённый
      и превышающий пределы PDF — не «кода нет», а недостающее свидетельство: проверка помечается
      неполной (PDF_UNSCANNABLE), вердикт не опускается до LOW_RISK (SBX-010, SBX-011). То же для
      страниц сверх десятой (PDF_NOT_FULLY_RENDERED) и для развёртывания без декодера
      (PDF_NOT_EXAMINED).
    planned_fix: >-
      Закрыто в MSP 1.1 §57. Воркер работает без сети, без права писать файлы и порождать процессы
      (RLIMIT_FSIZE и RLIMIT_NPROC равны нулю), с пределами процессора и памяти; в контейнерной
      схеме — в отдельном контейнере без сетевых интерфейсов, от непривилегированного пользователя,
      с файловой системой только для чтения. Скрипты PDF не исполняются: библиотека PDFium собрана
      без JavaScript-движка, формы не инициализируются.

      Статус VALIDATION, а не RESOLVED: условия §57 (позитивные, негативные, повреждённые,
      таймаутные и песочничные тесты) выполнены на синтетическом корпусе, но не подтверждены на
      реальном потоке — по правилу этого реестра пробел закрывается кейсом, который раньше падал, а
      теперь проходит на настоящей почте. Остаточные ограничения названы: код мельче примерно двух
      сантиметров на странице при разрешении 150 dpi может не прочитаться; страницы после десятой
      не рисуются (и это видно в вердикте); QR внутри вложенных вложений PDF (портфолио) не
      извлекается.

  - id: GAP-003
    category: malicious_attachment
    description: Архивы 7z и RAR не разбираются статически.
    root_cause: >-
      В составе v1 нет безопасной внутрипроцессной библиотеки для этих форматов. Внешний
      распаковщик означал бы исполнение стороннего кода над содержимым недоверенного письма.
    severity: medium
    status: VALIDATION
    owner: detection-attachment@corp.example
    target_release: MSP 1.1
    examples:
      - SBX-001
      - SBX-002
      - SBX-003
      - SBX-004
      - SBX-005
      - SBX-006
    mitigation: >-
      Оглавление 7z и RAR (RAR 4 и RAR 5) читается в изолированном процессе
      (msp_attachment_sandbox.archive_worker), без распаковки содержимого. Видны имена, размеры,
      признаки шифрования и ссылок: исполняемый файл и сценарий внутри архива находятся по имени
      (SBX-001, SBX-002, SBX-003), заявленная «бомба» определяется по заголовку и ничего не
      разворачивает (SBX-005). Архив с паролем — ENCRYPTED_UNSCANNABLE, а не «чистый» (SBX-004).
      Содержимое файлов при этом не проверяется, и это названо в каждом вердикте: признак
      LISTING_ONLY делает проверку неполной (LIMIT_EXCEEDED), письмо не опускается до LOW_RISK
      (SBX-006). Архив, который не удалось разобрать, и пустая запись списка трактуются как
      повреждённые, а не как пустые.
    planned_fix: >-
      Закрыто в MSP 1.1 §56 вариантом «разбор без распаковки» из ADR (вариант 2): чужой код не
      исполняется над содержимым вложений вообще. Лимиты §56 применяются к оглавлению: размер
      архива, суммарный заявленный размер, коэффициент сжатия, число файлов и длина имени. Глубина
      вложенности по оглавлению известна только по именам вложенных архивов (NESTED_ARCHIVE).

      Статус VALIDATION, а не RESOLVED: условия §56 (покрытие корпусом, защита от бомб, изоляция
      сбоев, зелёная регрессия) выполнены на синтетическом корпусе, но не подтверждены на
      реальном потоке. Остаточные ограничения названы: содержимое файлов внутри 7z и RAR не
      проверяется — ни антивирусом, ни правилами; усечённый архив, у которого читается только
      начало, показывает лишь прочитанную часть, а вердикт остаётся неполным. Полная распаковка в
      изолированном процессе (вариант 1 ADR) остаётся возможным развитием, но не необходима для
      закрытия пробела.

  - id: GAP-005
    category: authentication
    description: >-
      Rspamd 3.12.1 пропускает синтаксически неверный механизм SPF и вычисляет остаток записи,
      тогда как RFC 7208 §4.6 требует permerror.
    root_cause: >-
      Поведение модуля SPF сканера. Проверку нельзя переписывать в MSP (ТЗ 1.2 запрещает
      собственную реализацию SPF), поэтому отличие принято и названо.
    severity: low
    status: VALIDATION
    owner: detection-auth@corp.example
    target_release: MSP 1.3
    examples:
      - SPF-PERMERROR-DEVIATION
    mitigation: >-
      Результат нормализуется и помечается как полученный от сканера; сигнал AUTH_SPF_FAIL имеет
      низкий вес и ничего не отклоняет. Отличие описано в SPF_VALIDATION.md и проверяется в
      лабораторной матрице (tests/spam/test_spf.py), так что смена поведения сканера не пройдёт
      незамеченной.
    planned_fix: >-
      Подтвердить долю затронутых доменов на реальном потоке; при необходимости рассмотреть
      обновление Rspamd или отдельный разбор записи без подмены проверки.

  - id: GAP-006
    category: authentication
    description: >-
      Rspamd 3.12.1 не реализует DMARC по RFC 9989: нет поиска по дереву, np и t.
    root_cause: >-
      Модуль DMARC сканера следует RFC 7489. Переписывать DMARC в MSP запрещено ТЗ 1.2, поэтому
      отличие принято и названо.
    severity: low
    status: VALIDATION
    owner: detection-auth@corp.example
    target_release: MSP 1.3
    examples:
      - DMARC-RFC9989-DEVIATION
    mitigation: >-
      Результат DMARC используется как слабый сигнал, принуждения нет. Все провалы при политике
      reject попадают в обязательный просмотр аналитика (DMARC_REJECT_FAILURE). Отличия описаны в
      DMARC_RFC9989.md и фиксируются тестами tests/spam/test_dmarc.py.
    planned_fix: >-
      Измерить расхождения на реальном потоке просмотром; решение об отказе возможно только после
      reject_safety (SPAM_REAL_FLOW_VALIDATION.md).
