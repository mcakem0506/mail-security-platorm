# Prometheus scrape configuration (ТЗ 31).
#
# The platform exposes /metrics on the API. Access is restricted in nginx to the monitoring
# network, so Prometheus scrapes it directly over the internal network rather than through the
# public entry point.

global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    platform: mail-security

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: msp-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          component: api

  # Worker metrics are exported through the shared registry, so the API endpoint already covers
  # queue depth and provider counters. A dedicated exporter is added here when the workers are
  # scaled onto separate hosts.

  # Узлы шлюза (ТЗ 1.1 §45): агент отдаёт /metrics на порту 9100. Порт открывается только во
  # внутренней сети мониторинга и не публикуется наружу.
  - job_name: msp-gateway
    static_configs:
      - targets: ["gateway-postfix:9100"]
        labels:
          component: gateway

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          component: database

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          component: cache
