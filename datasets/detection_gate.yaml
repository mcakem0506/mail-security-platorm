# Пороги релизного гейта детектирования (ТЗ 1.0.3 §9).
#
# Значения ниже — стартовые. ТЗ прямо требует скорректировать их после пилота, на реальных
# цифрах, а не на догадках: порог, выставленный до первого прогона на живой почте, измеряет
# не качество, а оптимизм того, кто его писал.
#
# Гейт блокирует релиз, а не предупреждает. Предупреждение, которое можно не заметить, через
# месяц перестают читать.
detection_gate:
  # Ложное срабатывание дороже пропуска: аналитик, разбирающий шум, перестаёт читать очередь.
  overall_precision_min: 0.95

  # Recall по категориям, где пропуск обходится дороже всего.
  bec_recall_min: 0.85
  impersonation_recall_min: 0.90
  phishing_recall_min: 0.85

  # Насколько метрика может упасть относительно базовой линии, в процентах.
  max_regression_percent: 3

  # Категории, где потеря ранее обнаруживаемой угрозы блокирует релиз.
  high_severity_categories:
    - bec
    - phishing
    - impersonation
    - credential_theft
    - malicious_attachment
    - supplier_fraud
    - invoice_fraud
    - payroll_fraud

  # Сценарии, которые обязаны проходить при любых агрегатных цифрах.
  critical_case_ids:
    - GWC-011   # подделанный Authentication-Results от имени нашего сервера
    - GWC-016   # подтверждённое обнаружение шлюза — жёсткий сигнал
    - GWC-006   # скопированные заголовки шлюза не снижают вердикт
    - BEC-001   # смена банковских реквизитов
    - PHI-043   # форма ввода учётных данных

  # Правило, срабатывающее чаще этой доли легитимной почты, — шум по определению.
  max_benign_trigger_rate: 0.25
