# Точка входа конфигурации Rspamd для MSP 1.2. Файлы пакета (common.conf, options.inc, ...) не
# правятся: наши настройки лежат в LOCAL_CONFDIR (выпуск конфигурации), а воркеры, которых нет в
# пакетном rspamd.conf, объявлены здесь.
#
# Два прокси-воркера — два направления (ТЗ 1.2 §5): входящий и исходящий. Направление не
# выводится из From, его задаёт слушатель Postfix, который подключился к своему сокету.
.include "$CONFDIR/common.conf"

options {
    pidfile = "$RUNDIR/rspamd.pid";
    .include "$CONFDIR/options.inc"
    .include(try=true; priority=1,duplicate=merge) "$LOCAL_CONFDIR/local.d/options.inc"
    .include(try=true; priority=10) "$LOCAL_CONFDIR/override.d/options.inc"
}

logging {
    type = "console";
    .include "$CONFDIR/logging.inc"
    .include(try=true; priority=1,duplicate=merge) "$LOCAL_CONFDIR/local.d/logging.inc"
    .include(try=true; priority=10) "$LOCAL_CONFDIR/override.d/logging.inc"
}

# Настройки шлюза принуждения MSP 1.3 (читает rspamd.local.lua). Раздела нет в пакетной конфигурации.
msp_enforcement {
    .include(try=true; priority=1,duplicate=merge) "$LOCAL_CONFDIR/local.d/msp_enforcement.conf"
}

worker "controller" {
    bind_socket = "127.0.0.1:11334";
    .include "$CONFDIR/worker-controller.inc"
    .include(try=true; priority=1,duplicate=merge) "$LOCAL_CONFDIR/local.d/worker-controller.inc"
    .include(try=true; priority=10) "$LOCAL_CONFDIR/override.d/worker-controller.inc"
}

worker "rspamd_proxy" {
    bind_socket = "0.0.0.0:11332";
    .include "$CONFDIR/worker-proxy.inc"
    .include(try=true; priority=1,duplicate=merge) "$LOCAL_CONFDIR/local.d/worker-proxy-inbound.inc"
    .include(try=true; priority=10) "$LOCAL_CONFDIR/override.d/worker-proxy-inbound.inc"
}

worker "rspamd_proxy" {
    bind_socket = "0.0.0.0:11333";
    .include "$CONFDIR/worker-proxy.inc"
    .include(try=true; priority=1,duplicate=merge) "$LOCAL_CONFDIR/local.d/worker-proxy-outbound.inc"
    .include(try=true; priority=10) "$LOCAL_CONFDIR/override.d/worker-proxy-outbound.inc"
}
