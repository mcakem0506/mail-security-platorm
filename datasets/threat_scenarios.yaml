# Каталог сценариев угроз (ТЗ 1.0.3 §28) и карта покрытия (§37).
#
# Каталог отвечает на вопрос, на который нельзя ответить списком правил: от чего платформа
# защищает. Правила — это «как», сценарии — «от чего», и соответствие между ними не взаимно
# однозначно: один сценарий закрывается несколькими правилами, одно правило участвует в
# нескольких сценариях.
#
# Покрытие не записывается в этот файл — оно вычисляется из пакета правил при каждом запросе.
# Запись «покрыто», пережившая удаление правила, опаснее отсутствия записи: она утверждает
# защиту, которой нет.
#
# У каждого сценария есть кейсы золотого корпуса (`fixtures`). Сценарий без кейсов непроверяем:
# заявление о покрытии в этом случае ничем не подтверждено, и оценка это показывает.
version: "1.0.3"
scenarios:
  # --- Фишинг ------------------------------------------------------------------------------
  - id: THR-PHISH-001
    title: Кража учётных данных через поддельную страницу входа
    category: credential_theft
    severity: high
    description: >-
      Письмо имитирует уведомление сервиса (почта, портал, VPN) и ведёт на страницу входа,
      визуально повторяющую корпоративную. Цель — пароль и второй фактор.
    rules:
      - URL-001
      - URL-002
      - URL-010
      - URL-011
      - URL-012
      - URL-020
      - URL-021
      - URL-022
      - ATT-015
    fixtures: [PHI-001, PHI-002]
    playbook: PB-CREDENTIAL-THEFT

  - id: THR-PHISH-002
    title: Ссылка через редирект или сокращатель
    category: phishing_url
    severity: medium
    description: >-
      Настоящий адрес скрыт за сокращателем, открытым редиректом доверенного домена или
      цепочкой переходов. Проверка по домену-источнику ничего не даёт.
    rules:
      - URL-003
      - URL-004
      - URL-013
      - URL-023
    fixtures: [PHI-002]
    playbook: PB-CREDENTIAL-THEFT

  - id: THR-PHISH-003
    title: Поддельная страница облачного хранилища
    category: credential_theft
    severity: high
    description: >-
      Письмо сообщает о «документе в общем доступе» и ведёт на поддельную страницу облачного
      сервиса. Отличается от THR-PHISH-001 предлогом: не тревога, а рабочая рутина.
    rules:
      - BEC-020
      - BEC-021
      - URL-022
    fixtures: [CRD-001]
    playbook: PB-CREDENTIAL-THEFT

  - id: THR-PHISH-004
    title: Квишинг — ссылка внутри QR-кода
    category: qr_phishing
    severity: high
    description: >-
      Ссылка перенесена в изображение, а переход происходит с личного телефона — вне периметра,
      вне прокси и вне проверки ссылок.
    rules:
      - URL-030
      - URL-031
      - URL-032
    fixtures: [QRP-001, QRP-002, QRP-003, QRP-004]
    playbook: PB-QR-PHISHING

  # --- BEC и денежные схемы -----------------------------------------------------------------
  - id: THR-BEC-001
    title: Запрос от имени руководителя
    category: executive_impersonation
    severity: high
    description: >-
      Письмо от имени руководителя требует срочного платежа, перевода или покупки сертификатов
      в обход обычного порядка согласования.
    rules:
      - BEC-003
      - BEC-004
      - BEC-005
      - BEC-009
      - BEC-010
      - SND-034
      - SND-038
    fixtures: [BEC-001]
    playbook: PB-BEC-PAYMENT

  - id: THR-BEC-002
    title: Подмена платёжных реквизитов контрагента
    category: invoice_payment_fraud
    severity: critical
    description: >-
      Контрагент (или тот, кто им представляется) сообщает о смене банковских реквизитов.
      Самый дорогой сценарий: деньги уходят добровольно и по действующему договору.
    rules:
      - BEC-001
      - BEC-002
      - BEC-011
      - BEC-012
      - BEC-014
      - BEC-015
      - BEC-025
      - SND-032
    fixtures: [SUP-001, SUP-002, INV-001]
    playbook: PB-BEC-PAYMENT

  - id: THR-BEC-003
    title: Смена зарплатных реквизитов сотрудника
    category: hr_scam
    severity: high
    description: >-
      Письмо от имени сотрудника просит перечислять зарплату на другой счёт. Сумма меньше, чем
      в THR-BEC-002, но схема повторяется ежемесячно и обнаруживается поздно.
    rules:
      - BEC-013
      - BEC-024
      - BEC-008
    fixtures: [PAY-001]
    playbook: PB-BEC-PAYMENT

  # --- Подмена отправителя ------------------------------------------------------------------
  - id: THR-ID-001
    title: Прямая подмена адреса отправителя
    category: sender_spoofing
    severity: high
    description: >-
      Письмо отправлено от корпоративного адреса извне. Распознаётся по провалу аутентификации
      и несоответствию пути доставки.
    rules:
      - SND-001
      - SND-002
      - SND-003
      - SND-010
      - SND-011
      - GW-013
    fixtures: [IMP-001, IMP-002]
    playbook: PB-IMPERSONATION

  - id: THR-ID-002
    title: Похожий домен или подменённое отображаемое имя
    category: lookalike_domain
    severity: high
    description: >-
      Адрес выглядит знакомым: похожий домен, смешанные алфавиты, корпоративное имя во внешнем
      ящике. Аутентификация при этом проходит — домен принадлежит отправителю.
    rules:
      - SND-020
      - SND-030
      - SND-031
      - SND-034
      - SND-036
      - SND-037
      - SND-042
    fixtures: [IMP-003, IMP-010, LKA-001]
    playbook: PB-IMPERSONATION

  # --- Вложения -----------------------------------------------------------------------------
  - id: THR-ATT-001
    title: Исполняемое или скриптовое вложение
    category: malicious_attachment
    severity: critical
    description: >-
      Во вложении исполняемый файл, скрипт или ярлык — в том числе под видом документа
      (двойное расширение, подмена символов в имени).
    rules:
      - ATT-001
      - ATT-002
      - ATT-003
      - ATT-007
      - ATT-010
    fixtures: [ATT-001, ATT-002, ATT-003]
    playbook: PB-MALICIOUS-ATTACHMENT

  - id: THR-ATT-002
    title: Файл, собираемый в браузере получателя
    category: suspicious_attachment
    severity: high
    description: >-
      HTML-вложение или тело письма содержит закодированную нагрузку и код её сборки. На пути
      письма вложения не видит ни один фильтр.
    rules:
      - ATT-044
      - ATT-045
      - ATT-046
    fixtures: [SMG-001, SMG-002, SMG-003, SMG-004, SMG-005]
    playbook: PB-MALICIOUS-ATTACHMENT

  - id: THR-ATT-003
    title: Документ, обращающийся наружу при открытии
    category: suspicious_attachment
    severity: high
    description: >-
      Документ без макросов подгружает удалённый шаблон, обращается к сетевому ресурсу по
      UNC-пути или содержит поле DDE. Проверки, рассчитанные на макросы, его пропускают.
    rules:
      - ATT-040
      - ATT-041
      - ATT-042
      - ATT-043
    fixtures: [DOC-001, DOC-002, DOC-003]
    playbook: PB-MALICIOUS-ATTACHMENT

  # --- Прочее -------------------------------------------------------------------------------
  - id: THR-INT-001
    title: Злоупотребление из внутреннего ящика
    category: internal_abuse
    severity: high
    description: >-
      Запрос приходит с настоящего внутреннего адреса: учётная запись скомпрометирована либо
      сотрудник действует сам. Аутентификация проходит, подмены нет.
    rules:
      - BEC-008
      - BEC-009
      - BEC-016
      - SND-040
    fixtures: [INT-001]
    playbook: PB-INTERNAL-ABUSE

  - id: THR-GW-001
    title: Расхождение с вышестоящим шлюзом
    category: gateway
    severity: medium
    description: >-
      Шлюз пропустил письмо, а платформа считает его опасной, либо шлюз его пометил, а
      платформа — нет. Расхождение само по себе является поводом посмотреть.
    rules:
      - GW-001
      - GW-003
      - GW-004
      - GW-011
      - GW-016
    fixtures: [GWC-001]
    playbook: PB-GATEWAY-CONFLICT

  - id: THR-UNS-001
    title: Письмо, которое не удалось проверить
    category: unscannable
    severity: medium
    description: >-
      Шифрование, пароль на архиве, превышение лимитов разбора или нечитаемый QR-код. Не
      детект, но и не чистый результат: платформа обязана сказать, чего она не видела.
    rules:
      - LIM-001
      - LIM-002
      - LIM-003
      - LIM-004
      - LIM-005
      - LIM-006
      - LIM-007
    fixtures: [ADV-001, ADV-002]
    playbook: PB-UNSCANNABLE
