# Настройка сканера секретов.
#
# Правила берутся стандартные; здесь только разрешения, и каждое — узкое.
#
# Зачем файл вообще появился: при запуске по pull request сканер смотрит дифф, а при ручном
# запуске ветки — историю целиком, и находил в ней синтетический пароль из теста
# (`Correct-Horse-Battery-Staple-9`), помечая его как generic-api-key. Падение верное по форме и
# бессмысленное по сути, но снимать проверку с каталога `tests/` целиком нельзя: настоящая
# утечка в тест попадает так же легко, как в рабочий код, и именно в тестах её меньше всего
# ждут. Поэтому разрешены не файлы, а **конкретные строки**, видимые в этом файле.
#
# Правило для новых тестов: синтетический пароль называется по образцу
# `<Что>-Test-Password-<цифра>`, и тогда он проходит сканер без правок здесь. Любая другая
# строка, похожая на секрет, остановит сборку — так и задумано.

[extend]
useDefault = true

[allowlist]
description = "Синтетические учётные данные тестов и стендов"

# Пароли и ключи, которые существуют только в тестах и на стенде. Перечислены дословно, чтобы
# список нельзя было расширить незаметно.
regexes = [
  '''Correct-Horse-Battery-Staple-9''',
  '''Another-Strong-Password-1''',
  '''[A-Za-z]+-Test-Password-\d''',
  '''test-secret-key-for-unit-tests-only-not-production''',
  '''ci-only-secret-key-not-used-anywhere-else''',
  # Подпись DKIM в валидационном корпусе: письмо, заявляющее dkim=pass, обязано нести подпись,
  # иначе сам этот факт становится аномалией. Значение — base64 от строки
  # "fakesignatureforthevalidationcorpusonly".
  '''ZmFrZXNpZ25hdHVyZWZvcnRoZXZhbGlkYXRpb25jb3JwdXNvbmx5''',
]

# Явно отрицательные значения, которыми тесты проверяют отказ в доступе.
stopwords = [
  "not-a-real-token",
  "not-the-right-token",
  "wrong-password-value",
  "bad-password-x",
]
