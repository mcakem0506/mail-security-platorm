# Реестр известных пробелов детектирования (ТЗ 1.0.3 §27).
#
# Пробел здесь — это осознанно принятое ограничение: у него есть владелец, оценка серьёзности и
# целевой релиз. Пропуск, попадающий в зарегистрированный пробел, гейт пропускает как известный;
# пропуск без записи — регрессия и блокер (ТЗ 1.0.3 §60).
#
# Реестр существует, чтобы «мы про это знаем» нельзя было сказать задним числом.
gaps:
  - id: GAP-001
    category: impersonation
    description: >-
      Вставка или удвоение символа в короткой метке домена (coorp.example, corpp.example для
      corp.example) не распознаётся как опечаточный домен.
    root_cause: >-
      Проверка опечаточных доменов не применяется к меткам короче шести символов. Для
      четырёхбуквенной метки расстояние в один символ даёт десятки обычных слов (card, core,
      cork, corn), и снижение порога дало бы поток ложных срабатываний на легитимной почте.
      Ограничение осознанное: цена ложного срабатывания здесь выше цены пропуска.
    severity: medium
    status: ACCEPTED
    owner: detection-sender@corp.example
    target_release: MSP 1.0.4
    examples:
      - IMP-017
      - IMP-018
    mitigation: >-
      Организациям с короткими корпоративными доменами рекомендуется регистрировать очевидные
      варианты написания. Дополнительно такие письма ловятся остальными признаками: отсутствие
      истории отправителя, провал DMARC, платёжная тематика.
    planned_fix: >-
      Проверять вставку символа для коротких меток только при совпадении по skeleton и наличии
      дополнительного признака (первое письмо от отправителя, провал аутентификации).

  - id: GAP-002
    category: qr_phishing
    description: QR-коды в изображениях не разбираются, ссылка из них не извлекается.
    root_cause: >-
      Декодер QR не входит в состав платформы. Добавление зависимости, разбирающей изображения
      из недоверенных писем, расширяет поверхность атаки разбора и требует отдельной оценки.
    severity: high
    status: OPEN
    owner: detection-core@corp.example
    target_release: MSP 1.0.3
    examples: []
    mitigation: >-
      Изображение-вложение без текста и со ссылкой-призывом остаётся подозрительным по
      остальным признакам. Отсутствие разбора фиксируется как missing_evidence, поэтому вердикт
      не может опуститься до LOW_RISK.
    planned_fix: Безопасное извлечение QR с ограничением ресурсов, без сетевых обращений.

  - id: GAP-003
    category: malicious_attachment
    description: Архивы 7z и RAR не разбираются статически.
    root_cause: >-
      В составе v1 нет безопасной внутрипроцессной библиотеки для этих форматов. Внешний
      распаковщик означал бы исполнение стороннего кода над содержимым недоверенного письма.
    severity: medium
    status: ACCEPTED
    owner: detection-attachment@corp.example
    target_release: MSP 1.1
    examples: []
    mitigation: >-
      Такие вложения помечаются как непроверенные, вердикт не опускается до LOW_RISK, а факт
      попадает в missing_evidence.
    planned_fix: Оценить безопасные библиотеки либо разбор в изолированном контуре.
